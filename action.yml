name: Retro Museum prevalidation
description: Validate a prebuilt game in a bounded WASM runtime without running repository scripts.
author: Manaty
branding:
  icon: check-circle
  color: green
inputs:
  path:
    description: Directory containing retro-museum.json and dist/game.rmg.json
    required: false
    default: .
outputs:
  status:
    description: passed or failed
    value: ${{ steps.validate.outputs.status }}
  sha256:
    description: SHA-256 of the validated immutable package
    value: ${{ steps.validate.outputs.sha256 }}
  report:
    description: Absolute JSON report path (in RUNNER_TEMP)
    value: ${{ steps.validate.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
    - name: Install trusted validator dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SDK_PATH: ${{ github.action_path }}
      run: npm ci --prefix "$SDK_PATH" --ignore-scripts --no-audit --no-fund --userconfig /dev/null
    - name: Validate prebuilt package
      id: validate
      shell: bash
      env:
        SDK_PATH: ${{ github.action_path }}
        GAME_PATH: ${{ inputs.path }}
      run: node "$SDK_PATH/validate.js" "$GAME_PATH"
